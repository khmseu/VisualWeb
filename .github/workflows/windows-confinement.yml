name: Windows confinement

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      compare_renderer_variants:
        description: Compare portable and RID renderer smoke wall times
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.401
          architecture: ${{ matrix.architecture }}
      - run: dotnet build VisualWeb.slnx --configuration Release
      - name: Run fast tests
        run: >-
          dotnet test VisualWeb.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~VisualWeb.Browser.Tests&FullyQualifiedName!~VisualWeb.Engine.Scripting.Tests"
          --logger "console;verbosity=normal"
      - name: Publish framework-dependent Windows renderer candidate
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:GITHUB_WORKSPACE "src/Apps/VisualWeb.Renderer/obj/windows-rid-build/"
          dotnet publish src/Apps/VisualWeb.Renderer/VisualWeb.Renderer.csproj --configuration Release --runtime win-${{ matrix.architecture }} --self-contained false -p:UseAppHost=true "-p:BaseOutputPath=$buildRoot" --output src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/win-${{ matrix.architecture }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Windows renderer publish candidate
        shell: pwsh
        run: |
          ./scripts/Validate-WindowsRendererPublish.ps1 -RuntimeIdentifier win-${{ matrix.architecture }} -PublishDirectory src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/win-${{ matrix.architecture }} -PortableDirectory src/Apps/VisualWeb.Renderer/bin/Release/net10.0 -RequireReduction
      - name: Select validated RID renderer fixture for browser tests
        shell: pwsh
        run: |
          $rendererFixture = Join-Path $env:GITHUB_WORKSPACE "src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/win-${{ matrix.architecture }}"
          dotnet build tests/VisualWeb.Browser.Tests/VisualWeb.Browser.Tests.csproj --configuration Release --no-restore "-p:RendererFixtureSource=$rendererFixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repeat CPU-pressure cancellation recovery
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "CPU-pressure cancellation recovery attempt $attempt/5 (${{ matrix.architecture }})"
            dotnet test tests/VisualWeb.Browser.Tests/VisualWeb.Browser.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~WindowsCpuPressureCancellationOrDeadlineRestartsOnlyAffectedRenderer" --logger "console;verbosity=normal"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: dotnet run --project tools/V8Smoke --configuration Release --no-build -- --require-sandbox --font tests/Engine.Text.Tests/Data/NotoSans.ttf
      - run: dotnet run --project tools/PlatformSmoke --configuration Release --no-build -- windows
      # The single-process opt-out is only for trusted offline development smoke.
      - run: dotnet run --project src/Apps/VisualWeb.Browser --configuration Release --no-build -- --development-single-process --allow-unsandboxed-development --font tests/Engine.Text.Tests/Data/NotoSans.ttf --smoke --backend windows
      - run: dotnet run --project tools/WindowsSandboxSmoke --configuration Release --no-build -- --font tests/Engine.Text.Tests/Data/NotoSans.ttf
      - name: Run slow browser tests
        run: dotnet test tests/VisualWeb.Browser.Tests/VisualWeb.Browser.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
      - name: Run slow scripting tests
        run: dotnet test tests/Engine.Scripting.Tests/Engine.Scripting.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
      - run: dotnet run --project src/Apps/VisualWeb.Browser --configuration Release --no-build -- --multiprocess --renderer src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/win-${{ matrix.architecture }}/VisualWeb.Renderer.dll --font tests/Engine.Text.Tests/Data/NotoSans.ttf --smoke --backend windows
      - run: dotnet run --project src/Apps/VisualWeb.Browser --configuration Release --no-build -- --development-multiprocess --renderer src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/win-${{ matrix.architecture }}/VisualWeb.Renderer.dll --font tests/Engine.Text.Tests/Data/NotoSans.ttf --require-sandbox --enable-inline-scripts --smoke --backend windows
      - name: Compare portable and RID Windows renderer smokes (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.compare_renderer_variants
        timeout-minutes: 15
        shell: pwsh
        run: |
          $rid = "win-${{ matrix.architecture }}"
          $rendererPaths = @{
            portable = "src/Apps/VisualWeb.Renderer/bin/Release/net10.0/VisualWeb.Renderer.dll"
            rid = "src/Apps/VisualWeb.Renderer/obj/windows-rid-publish/$rid/VisualWeb.Renderer.dll"
          }
          $scenarios = @(
            [pscustomobject]@{ Name = "static"; EnableInlineScripts = $false },
            [pscustomobject]@{ Name = "scripted"; EnableInlineScripts = $true }
          )
          $orders = @(
            [pscustomobject]@{ Name = "portable-to-rid"; Variants = @("portable", "rid") },
            [pscustomobject]@{ Name = "rid-to-portable"; Variants = @("rid", "portable") }
          )
          foreach ($scenario in $scenarios) {
            foreach ($order in $orders) {
              foreach ($variant in $order.Variants) {
                $cliArguments = @(
                  "run", "--project", "src/Apps/VisualWeb.Browser", "--configuration", "Release", "--no-build", "--",
                  "--multiprocess", "--require-sandbox",
                  "--renderer", $rendererPaths[$variant],
                  "--font", "tests/Engine.Text.Tests/Data/NotoSans.ttf",
                  "--smoke", "--backend", "windows"
                )
                if ($scenario.EnableInlineScripts) {
                  $cliArguments += "--enable-inline-scripts"
                }

                Write-Output "smoke-compare v=1 event=start rid=$rid scenario=$($scenario.Name) order=$($order.Name) renderer=$variant wall-ms=na exit=na"
                $cliOutput = @()
                $timer = [System.Diagnostics.Stopwatch]::StartNew()
                & dotnet @cliArguments 2>&1 | Tee-Object -Variable cliOutput
                $exitCode = $LASTEXITCODE
                $timer.Stop()
                $wallMilliseconds = $timer.Elapsed.TotalMilliseconds.ToString("F3", [System.Globalization.CultureInfo]::InvariantCulture)
                Write-Output "smoke-compare v=1 event=end rid=$rid scenario=$($scenario.Name) order=$($order.Name) renderer=$variant wall-ms=$wallMilliseconds exit=$exitCode"

                if ($exitCode -ne 0) {
                  throw "Windows smoke comparison failed: scenario=$($scenario.Name) order=$($order.Name) renderer=$variant exit=$exitCode"
                }
                if (@($cliOutput | Where-Object { "$_" -match '^smoke-diagnostic-error(?:\s|$)' }).Count -gt 0) {
                  throw "Windows smoke comparison emitted smoke-diagnostic-error: scenario=$($scenario.Name) order=$($order.Name) renderer=$variant"
                }
              }
            }
          }
