name: Windows confinement

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: windows-11-arm
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
          architecture: ${{ matrix.architecture }}
      - run: dotnet build VisualWeb.slnx --configuration Release
      - run: dotnet test tests/Platform.Tests/Platform.Tests.csproj --configuration Release --no-build
      - run: dotnet test tests/VisualWeb.Browser.Tests/VisualWeb.Browser.Tests.csproj --configuration Release --no-build
      - run: dotnet test tests/Engine.Scripting.Tests/Engine.Scripting.Tests.csproj --configuration Release --no-build
      - run: dotnet run --project tools/V8Smoke --configuration Release --no-build -- --require-sandbox --font tests/Engine.Text.Tests/Data/NotoSans.ttf
      - run: dotnet run --project tools/PlatformSmoke --configuration Release --no-build -- windows
      - run: dotnet run --project src/Apps/VisualWeb.Browser --configuration Release --no-build -- --development-single-process --font tests/Engine.Text.Tests/Data/NotoSans.ttf --smoke --backend windows
      - run: dotnet run --project src/Apps/VisualWeb.Browser --configuration Release --no-build -- --development-multiprocess --renderer src/Apps/VisualWeb.Renderer/bin/Release/net10.0/VisualWeb.Renderer.dll --font tests/Engine.Text.Tests/Data/NotoSans.ttf --require-sandbox --smoke --backend windows
      - run: dotnet run --project tools/WindowsSandboxSmoke --configuration Release --no-build -- --font tests/Engine.Text.Tests/Data/NotoSans.ttf
